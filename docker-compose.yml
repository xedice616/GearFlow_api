services:

  postgres:
    image: postgres:18
    container_name: gearflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: "gearflow_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"

    ports:
      - "7878:5432"

    volumes:
      - gearflow_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gearflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: gearflow-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/gearflow_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"

      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRATION: "86400000"

      ADMIN_NAME: "${ADMIN_NAME:-GearFlow Admin}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"

      PORT: "8080"

    ports:
      - "8080:8080"

volumes:
  gearflow_postgres_data: